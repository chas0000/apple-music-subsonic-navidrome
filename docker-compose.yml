version: '3.8'

services:
  apple-music-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apple-music-bridge
    ports:
      - "8800:8800"
    volumes:
      # 挂载配置目录（持久化配置文件）
      - ./config:/app/config
      # 挂载音乐存储目录
      - ./music:/app/music
      # 使用命名卷持久化数据库（避免复制开销）
      - db_data:/app/apple_music_bridge.db
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8800/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  db_data:
    driver: local
