name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push to Docker Registry'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: apple_navidrome

jobs:
  build-binary:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --onefile \
            --name apple-music-bridge \
            --add-data "config.yaml:." \
            --add-data "subsonic.py:." \
            --add-data "navidrome.py:." \
            --add-data "apple_music_api.py:." \
            --add-data "database.py:." \
            --add-data "fm.py:." \
            --hidden-import fastapi \
            --hidden-import uvicorn \
            --hidden-import aiofiles \
            --hidden-import requests \
            --hidden-import httpx \
            --hidden-import beautifulsoup4 \
            --hidden-import pydantic \
            --hidden-import cachetools \
            --hidden-import yaml \
            main.py

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-bridge-linux-x64
          path: dist/apple-music-bridge
          retention-days: 30

      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist
          tar -czf apple-music-bridge-${{ github.ref_name }}-linux-x64.tar.gz apple-music-bridge
          sha256sum apple-music-bridge-${{ github.ref_name }}-linux-x64.tar.gz > apple-music-bridge-${{ github.ref_name }}-linux-x64.tar.gz.sha256

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/apple-music-bridge-${{ github.ref_name }}-linux-x64.tar.gz
            dist/apple-music-bridge-${{ github.ref_name }}-linux-x64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: apple-music-bridge-linux-x64
          path: dist/

      - name: Make binary executable
        run: chmod +x dist/apple-music-bridge

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.event.inputs.push_to_registry == 'true' || github.ref_type == 'tag')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.ref == format('refs/heads/{0}', 'master') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_to_registry == 'true' || github.ref_type == 'tag') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}
