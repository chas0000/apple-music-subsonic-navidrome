version: '3.8'

services:
  apple-music-bridge:
    container_name: apple-music-bridge
    image: ghcr.io/chas0000/apple_navidrome:latest 
    network_mode: host
    #ports:
    #  - "8800:8800"
    volumes:
      # 挂载配置目录（持久化配置文件）
      - ./config:/app/config
      # 挂载数据目录（持久化数据库）
      - ./data:/app/data
      # 挂载音乐存储目录
      - ./music:/app/music
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/app/data/apple_music_bridge.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8800/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
